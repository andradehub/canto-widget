name: Build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar protocolo
        run: dotnet run --project tests/ProtocolTests.csproj -c Release
      - name: Verificar sincronização Git
        run: ./tests/Sync.Tests.ps1
      - name: Compilar aplicativo portátil
        run: ./scripts/Build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CantoWidget-Windows-x64
          path: publish/CantoWidget.exe
