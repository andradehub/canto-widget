[package]
name = "canto-widget"
version = "2.1.0"
edition = "2024"
license = "MIT"
description = "Música e bateria AJAZZ na barra de tarefas, em Rust nativo."

[[bin]]
name = "CantoWidget"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = { version = "0.62.2", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Threading", "Win32_System_IO", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
